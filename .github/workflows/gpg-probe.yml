name: Temporary GPG probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe disposable pinentry and agent lifecycle
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, shutil, subprocess, tempfile, time
          with tempfile.TemporaryDirectory(prefix='stool-gpg-probe-') as directory:
              root=pathlib.Path(directory)
              home=root/'home'
              ring=root/'non-default-keyring'
              ring.mkdir(parents=True,mode=0o700)
              env=dict(os.environ,HOME=str(home),GNUPGHOME=str(ring))
              for name in ('GPG_AGENT_INFO','GPG_TTY','SSH_AUTH_SOCK','SSH_AGENT_PID'):
                  env.pop(name,None)
              pin=root/'pinentry'
              pin.write_text("#!/bin/sh\nprintf 'OK fixture ready\\n'\nwhile IFS= read -r line; do\n  case \"$line\" in GETPIN*) printf 'D synthetic-fixture-password\\n' ;; 'GETINFO pid'*) printf 'D %s\\n' \"$$\" ;; esac\n  printf 'OK\\n'\n  [ \"$line\" != BYE ] || break\ndone\n")
              pin.chmod(0o700)
              (ring/'gpg-agent.conf').write_text('pinentry-program '+str(pin)+'\n')
              def run(args, **kwargs):
                  result=subprocess.run(args,env=env,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=30,**kwargs)
                  print(args[0],args[1:4],result.returncode,result.stderr.decode(errors='replace'),flush=True)
                  return result
              for name in ('gpg','gpgconf','gpg-agent'):
                  print(name,shutil.which(name),flush=True)
              print(subprocess.check_output(['gpg','--version'],env=env,text=True).splitlines()[0],flush=True)
              run(['gpg','--no-options','--homedir',str(ring),'--batch','--pinentry-mode','loopback','--passphrase','synthetic-fixture-password','--quick-generate-key','Fixture <fixture@example.invalid>','ed25519','sign','0'])
              run(['gpgconf','--homedir',str(ring),'--kill','all'])
              time.sleep(2)
              log=root/'agent.log'
              with log.open('ab') as stream:
                  result=subprocess.run(['gpg-agent','--homedir',str(ring),'--daemon','--pinentry-program',str(pin)],env=env,stdout=subprocess.DEVNULL,stderr=stream,timeout=30)
              print('explicit-agent',result.returncode,log.read_text(),flush=True)
              listing=subprocess.check_output(['gpg','--homedir',str(ring),'--with-colons','--fingerprint','--list-secret-keys'],env=env,text=True)
              fingerprint=next(line.split(':')[9] for line in listing.splitlines() if line.startswith('fpr:'))
              run(['gpg','--no-options','--no-tty','--homedir',str(ring),'--armor','--export-secret-keys',fingerprint])
              run(['gpgconf','--homedir',str(ring),'--kill','all'])
          PYTHON
