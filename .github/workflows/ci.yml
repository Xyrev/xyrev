name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the Unix installer
        if: runner.os != 'Windows'
        run: python -m unittest discover -s tests -p 'test_installer.py' -v
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - name: Install GnuPG for disposable-key integration tests
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if ! command -v gpg >/dev/null 2>&1; then
            case "$RUNNER_OS" in
              Linux) sudo apt-get update && sudo apt-get install -y gnupg ;;
              macOS) brew install gnupg ;;
            esac
          fi
      - name: Test native GPG backup and restore with disposable keys
        if: runner.os != 'Windows'
        env:
          STOOL_BIN: target/debug/stool
        run: python -m unittest discover -s tests -p 'test_gpg_native.py' -v
      - name: Check generated CLI assets
        if: runner.os == 'macOS'
        run: |
          sh scripts/generate-cli-assets.sh
          git diff --exit-code -- completions man-page
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.74.0'
      - run: cargo test --locked --all-targets
