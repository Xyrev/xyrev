name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Match the release tag to Cargo metadata
        id: version
        run: |
          python - <<'PYTHON'
          import os, re, tomllib
          from pathlib import Path
          package = tomllib.loads(Path('Cargo.toml').read_text())['package']
          version = package['version']
          tag = os.environ['GITHUB_REF_NAME']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?', tag):
              raise SystemExit('Expected a vMAJOR.MINOR.PATCH release tag')
          if tag != 'v' + version:
              raise SystemExit(f'Tag {tag} does not match Cargo version {version}')
          packages = tomllib.loads(Path('Cargo.lock').read_text())['package']
          if not any(p['name'] == 'stool' and p['version'] == version for p in packages):
              raise SystemExit('Cargo.lock does not match the package version')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\nprerelease={str("-" in version).lower()}\n')
          PYTHON

  check:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the Unix installer
        if: runner.os != 'Windows'
        run: python -m unittest discover -s tests/python -p 'test_installer.py' -v
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - name: Install GnuPG for disposable-key integration tests
        if: runner.os != 'Windows'
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)
              if ! command -v gpg >/dev/null 2>&1; then
                sudo apt-get update && sudo apt-get install -y gnupg
              fi
              ;;
            macOS)
              # Refresh preinstalled GnuPG as well, so image snapshots do not
              # pin native-key tests to an import bug fixed by Homebrew.
              brew update
              if brew list --versions gnupg >/dev/null 2>&1; then
                brew upgrade gnupg
              else
                brew install gnupg
              fi
              ;;
          esac
      - name: Test native offline GPG and SSH backups with disposable keys
        if: runner.os != 'Windows'
        env:
          STOOL_BIN: target/debug/stool
        run: python -m unittest discover -s tests/python -p 'test_keys_native.py' -v
      - name: Check generated CLI assets
        if: runner.os == 'macOS'
        run: |
          sh scripts/generate-cli-assets.sh
          git diff --exit-code -- completions man-page

  msrv:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.74.0'
      - run: cargo test --locked --all-targets

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install musl build tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build locked release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Check the packaged CLI version and dotfile entry point
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          binary="target/$TARGET/release/stool"
          case "$TARGET" in *-windows-*) binary="$binary.exe" ;; esac
          test "$("$binary" --version)" = "stool $VERSION"
          "$binary" dotfile init --help
          "$binary" key backup --help
          "$binary" key restore --help
      - name: Package release
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python scripts/package-release.py --target "$TARGET" --tag "$GITHUB_REF_NAME" --output artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: stool-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  release:
    needs: [validate, check, msrv, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: stool-*
          path: artifacts
          merge-multiple: true
      - name: Validate every platform artifact and create checksums
        shell: bash
        run: |
          test "$(find artifacts -maxdepth 1 -type f | wc -l)" -eq 6
          for target in x86_64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc; do
            suffix=tar.gz
            case "$target" in *-windows-*) suffix=zip ;; esac
            test -s "artifacts/stool-$GITHUB_REF_NAME-$target.$suffix"
          done
          cd artifacts
          sha256sum *.tar.gz *.zip | sort -k2 > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Create version-specific release notes
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os, re
          from pathlib import Path
          tag = os.environ['GITHUB_REF_NAME']
          sections = re.split(r'(?m)^# ', Path('RELEASE_NOTES.md').read_text())
          matching = [section for section in sections if section.splitlines() and section.splitlines()[0] == 'stool ' + tag]
          if len(matching) != 1:
              raise SystemExit(f'Expected exactly one stool release notes section for {tag}')
          Path('release-notes.md').write_text('# ' + matching[0])
          PYTHON
      - name: Publish release after all checks and uploads succeed
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.validate.outputs.prerelease == 'false' }}
