name: Release Build (Optimized)

env:
  PROJECT_NAME: xyrev
  PROJECT_AUTH: "szwathub"
  RUST_MIN_SRV: "1.74.0"

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  min_version:
    name: MinSRV # Minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install `rust` toolchain (v${{ env.RUST_MIN_SRV }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_MIN_SRV }}
      - name: Test
        run: cargo test

  style:
    name: Style
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - { os: ubuntu-latest }
          - { os: macos-latest }
          - { os: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - name: Initialize workflow variables
        id: vars
        shell: bash
        run: |
          JOB_DO_FORMAT_TESTING="true"
          case ${{ matrix.job.os }} in windows-latest) unset JOB_DO_FORMAT_TESTING ;; esac;
          echo "JOB_DO_FORMAT_TESTING=${JOB_DO_FORMAT_TESTING}" >> $GITHUB_OUTPUT
          CARGO_FEATURES_OPTION='' ;
          if [ -n "${{ matrix.job.features }}" ]; then CARGO_FEATURES_OPTION='--features "${{ matrix.job.features }}"' ; fi
          echo "CARGO_FEATURES_OPTION=${CARGO_FEATURES_OPTION}" >> $GITHUB_OUTPUT
      - name: Install `rust` toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install wget for Windows
        if: matrix.job.os == 'windows-latest'
        run: cargo install wget --no-progress
      - name: typos-action
        uses: crate-ci/typos@master
      - name: "`fmt` testing"
        if: steps.vars.outputs.JOB_DO_FORMAT_TESTING
        run: cargo fmt --all -- --check
      - name: "`clippy` testing"
        if: success() || failure()
        run: cargo clippy ${{ matrix.job.cargo-options }} ${{ steps.vars.outputs.CARGO_FEATURES_OPTION }} -- -D warnings

  build:
    name: Build
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          # ============================================
          # 核心目标 - 覆盖 95%+ 用户
          # ============================================

          # Linux x86_64 - 最常用的 Linux 平台
          - {
              os: ubuntu-latest,
              target: x86_64-unknown-linux-gnu,
              use-cross: use-cross,
            }

          # Linux x86_64 musl - Docker/静态链接/嵌入式
          - {
              os: ubuntu-latest,
              target: x86_64-unknown-linux-musl,
              use-cross: use-cross,
            }

          # Linux ARM64 - 树莓派4+、ARM服务器 (AWS Graviton等)
          - {
              os: ubuntu-latest,
              target: aarch64-unknown-linux-gnu,
              use-cross: use-cross,
            }

          # macOS Intel - 仍有大量 Intel Mac 用户
          - { os: macos-latest, target: x86_64-apple-darwin }

          # macOS Apple Silicon - M1/M2/M3 Mac
          - { os: macos-latest, target: aarch64-apple-darwin }

          # Windows 64位 - 主流 Windows 平台
          - { os: windows-latest, target: x86_64-pc-windows-msvc }

          # ============================================
          # 已移除的目标及原因：
          # ============================================
          # ❌ i686-unknown-linux-gnu - 32位 Linux 已淘汰
          # ❌ i686-unknown-linux-musl - 32位 musl Linux 极少使用
          # ❌ arm-unknown-linux-gnueabihf - ARM32 老旧设备
          # ❌ arm-unknown-linux-musleabi - ARM32 musl 极少使用
          # ❌ aarch64-unknown-linux-musl - ARM64 musl 小众场景
          # ❌ i686-pc-windows-gnu - 32位 Windows GNU 几乎无人使用
          # ❌ i686-pc-windows-msvc - 32位 Windows 逐渐淘汰
          # ❌ x86_64-pc-windows-gnu - Windows GNU 工具链小众

    steps:
      - uses: actions/checkout@v4

      - name: Install any prerequisites
        shell: bash
        run: |
          case ${{ matrix.job.target }} in
            aarch64-unknown-linux-gnu) sudo apt-get -y update ; sudo apt-get -y install binutils-aarch64-linux-gnu ;;
          esac

      - name: Initialize workflow variables
        id: vars
        shell: bash
        run: |
          # toolchain
          TOOLCHAIN="stable"
          if [ -n "${{ matrix.job.toolchain }}" ]; then TOOLCHAIN="${{ matrix.job.toolchain }}" ; fi
          echo "TOOLCHAIN=${TOOLCHAIN}" >> $GITHUB_OUTPUT

          # staging directory
          STAGING='_staging'
          echo "STAGING=${STAGING}" >> $GITHUB_OUTPUT

          # determine EXE suffix
          EXE_suffix="" ; case ${{ matrix.job.target }} in *-pc-windows-*) EXE_suffix=".exe" ;; esac;
          echo "EXE_suffix=${EXE_suffix}" >> $GITHUB_OUTPUT

          # parse commit reference info
          REF_NAME=${GITHUB_REF#refs/*/}
          unset REF_BRANCH ; case ${GITHUB_REF} in refs/heads/*) REF_BRANCH=${GITHUB_REF#refs/heads/} ;; esac;
          unset REF_TAG ; case ${GITHUB_REF} in refs/tags/*) REF_TAG=${GITHUB_REF#refs/tags/} ;; esac;
          REF_SHAS=${GITHUB_SHA:0:8}
          echo "REF_NAME=${REF_NAME}" >> $GITHUB_OUTPUT
          echo "REF_BRANCH=${REF_BRANCH}" >> $GITHUB_OUTPUT
          echo "REF_TAG=${REF_TAG}" >> $GITHUB_OUTPUT
          echo "REF_SHAS=${REF_SHAS}" >> $GITHUB_OUTPUT

          # parse target
          unset TARGET_ARCH ; case ${{ matrix.job.target }} in aarch64-*) TARGET_ARCH=aarch64 ;; x86_64-*) TARGET_ARCH=x86_64 ;; esac;
          echo "TARGET_ARCH=${TARGET_ARCH}" >> $GITHUB_OUTPUT
          unset TARGET_OS ; case ${{ matrix.job.target }} in *-linux-*) TARGET_OS=linux ;; *-apple-*) TARGET_OS=macos ;; *-windows-*) TARGET_OS=windows ;; esac;
          echo "TARGET_OS=${TARGET_OS}" >> $GITHUB_OUTPUT

          # package name
          PKG_suffix=".tar.gz" ; case ${{ matrix.job.target }} in *-pc-windows-*) PKG_suffix=".zip" ;; esac;
          PKG_BASENAME=${PROJECT_NAME}-${REF_TAG:-$REF_SHAS}-${{ matrix.job.target }}
          PKG_NAME=${PKG_BASENAME}${PKG_suffix}
          echo "PKG_suffix=${PKG_suffix}" >> $GITHUB_OUTPUT
          echo "PKG_BASENAME=${PKG_BASENAME}" >> $GITHUB_OUTPUT
          echo "PKG_NAME=${PKG_NAME}" >> $GITHUB_OUTPUT

          # deployable tag?
          unset DEPLOY ; if [[ $REF_TAG =~ ^[vV]?[0-9].* ]]; then DEPLOY='true' ; fi
          echo "DEPLOY=${DEPLOY}" >> $GITHUB_OUTPUT

          # target-specific options
          CARGO_FEATURES_OPTION='' ;
          if [ -n "${{ matrix.job.features }}" ]; then CARGO_FEATURES_OPTION='--features "${{ matrix.job.features }}"' ; fi
          echo "CARGO_FEATURES_OPTION=${CARGO_FEATURES_OPTION}" >> $GITHUB_OUTPUT

          CARGO_USE_CROSS='true' ; case '${{ matrix.job.use-cross }}' in ''|0|f|false|n|no) unset CARGO_USE_CROSS ;; esac;
          echo "CARGO_USE_CROSS=${CARGO_USE_CROSS}" >> $GITHUB_OUTPUT

          JOB_DO_TESTING="true"
          case ${{ matrix.job.target }} in aarch64-*) unset JOB_DO_TESTING ;; esac;
          echo "JOB_DO_TESTING=${JOB_DO_TESTING}" >> $GITHUB_OUTPUT

          unset CARGO_TEST_OPTIONS
          case ${{ matrix.job.target }} in aarch64-*) CARGO_TEST_OPTIONS="--bin ${PROJECT_NAME}" ;; esac;
          echo "CARGO_TEST_OPTIONS=${CARGO_TEST_OPTIONS}" >> $GITHUB_OUTPUT

          # strip executable
          STRIP="strip"
          case ${{ matrix.job.target }} in
            *-pc-windows-msvc) STRIP="" ;;
            aarch64-unknown-linux-gnu) STRIP="aarch64-linux-gnu-strip" ;;
            aarch64-unknown-linux-musl) STRIP="" ;;
          esac;
          echo "STRIP=${STRIP}" >> $GITHUB_OUTPUT

      - name: Create all needed build/work directories
        shell: bash
        run: |
          mkdir -p '${{ steps.vars.outputs.STAGING }}'
          mkdir -p '${{ steps.vars.outputs.STAGING }}/${{ steps.vars.outputs.PKG_BASENAME }}'

      - name: rust toolchain ~ install
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.vars.outputs.TOOLCHAIN }}
          targets: ${{ matrix.job.target }}

      - name: Info
        shell: bash
        run: |
          gcc --version || true
          rustup -V
          rustup toolchain list
          rustup default
          cargo -V
          rustc -V

      - name: Install cross
        if: steps.vars.outputs.CARGO_USE_CROSS
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        run: |
          if [ -n "${{ steps.vars.outputs.CARGO_USE_CROSS }}" ]; then
            cross build --release --target=${{ matrix.job.target }} ${{ matrix.job.cargo-options }} ${{ steps.vars.outputs.CARGO_FEATURES_OPTION }}
          else
            cargo build --release --target=${{ matrix.job.target }} ${{ matrix.job.cargo-options }} ${{ steps.vars.outputs.CARGO_FEATURES_OPTION }}
          fi
        shell: bash

      - name: Test
        if: steps.vars.outputs.JOB_DO_TESTING
        run: |
          if [ -n "${{ steps.vars.outputs.CARGO_USE_CROSS }}" ]; then
            cross test --target=${{ matrix.job.target }} ${{ steps.vars.outputs.CARGO_TEST_OPTIONS}} ${{ matrix.job.cargo-options }} ${{ steps.vars.outputs.CARGO_FEATURES_OPTION }}
          else
            cargo test --target=${{ matrix.job.target }} ${{ steps.vars.outputs.CARGO_TEST_OPTIONS}} ${{ matrix.job.cargo-options }} ${{ steps.vars.outputs.CARGO_FEATURES_OPTION }}
          fi
        shell: bash

      - name: Package
        shell: bash
        run: |
          # binary
          cp 'target/${{ matrix.job.target }}/release/${{ env.PROJECT_NAME }}${{ steps.vars.outputs.EXE_suffix }}' '${{ steps.vars.outputs.STAGING }}/${{ steps.vars.outputs.PKG_BASENAME }}/'

          # strip binary (if needed)
          if [ -n "${{ steps.vars.outputs.STRIP }}" ]; then
            "${{ steps.vars.outputs.STRIP }}" '${{ steps.vars.outputs.STAGING }}/${{ steps.vars.outputs.PKG_BASENAME }}/${{ env.PROJECT_NAME }}${{ steps.vars.outputs.EXE_suffix }}'
          fi

          # README and LICENSE
          cp README.md '${{ steps.vars.outputs.STAGING }}/${{ steps.vars.outputs.PKG_BASENAME }}/'
          cp LICENSE '${{ steps.vars.outputs.STAGING }}/${{ steps.vars.outputs.PKG_BASENAME }}/'

          # base compressed package
          pushd '${{ steps.vars.outputs.STAGING }}/' >/dev/null
          case ${{ matrix.job.target }} in
            *-pc-windows-*) 7z -y a '${{ steps.vars.outputs.PKG_NAME }}' '${{ steps.vars.outputs.PKG_BASENAME }}'/* | tail -2 ;;
            *) tar czf '${{ steps.vars.outputs.PKG_NAME }}' '${{ steps.vars.outputs.PKG_BASENAME }}'/* ;;
          esac;
          popd >/dev/null

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-${{ matrix.job.target }}
          path: ${{ steps.vars.outputs.STAGING }}/${{ steps.vars.outputs.PKG_NAME }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd artifacts
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec sha256sum {} \; | sed 's|  \./[^/]*/|  |' | sort -k2 > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/${{ env.PROJECT_NAME }}-*/*
            SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## Supported Platforms

            This release supports the following platforms:

            ### Linux
            - `x86_64-unknown-linux-gnu` - Standard Linux (glibc)
            - `x86_64-unknown-linux-musl` - Static Linux (musl) - Docker/Containers
            - `aarch64-unknown-linux-gnu` - ARM64 Linux (Raspberry Pi 4+, ARM servers)

            ### macOS
            - `x86_64-apple-darwin` - Intel Mac
            - `aarch64-apple-darwin` - Apple Silicon (M1/M2/M3)

            ### Windows
            - `x86_64-pc-windows-msvc` - Windows 64-bit

            ## Installation

            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ env.PROJECT_AUTH }}/${{ env.PROJECT_NAME }}/main/newinstall.sh | bash
            ```

            Or download the appropriate binary for your platform from the assets below.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
