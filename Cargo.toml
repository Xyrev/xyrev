[package]
name = "xyrev"
version = "0.2.3"
edition = "2021"
authors = ["Zhiwei Sun <szwathub@gmail.com>"]
license = "MIT"

[[bin]]
name = "xyrev"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = true
strip = true

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
termcolor = "1.4.1"
cfg-if = "1.0"

[dev-dependencies]

[build-dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.4"
clap_mangen = "0.2"

[package.metadata.deb]
section = "utils"
assets = [
  ["target/release/xyrev", "usr/bin/", "755"],
  ["LICENSE", "usr/share/doc/xyrev/", "644"],
  ["README.md", "usr/share/doc/xyrev/README", "644"],
  ["man-page/xyrev.1", "usr/share/man/man1/xyrev.1", "644"],
  ["completions/xyrev.bash", "usr/share/bash-completion/completions/xyrev", "644"],
]
